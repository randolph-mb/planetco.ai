<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="PlanetCo.ai is the strategic AI observatory — built by Randolph Mbecheun. Coming soon." />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph -->
  <meta property="og:title" content="PlanetCo.ai — The Strategic AI Observatory" />
  <meta property="og:description"
    content="PlanetCo.ai is the strategic AI observatory — built by Randolph Mbecheun. Coming soon." />
  <meta property="og:image" content="assets/favicon_optimized.png" />
  <meta property="og:url" content="https://planetco.ai" />
  <meta property="og:type" content="website" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="PlanetCo.ai — The Strategic AI Observatory" />
  <meta name="twitter:description"
    content="PlanetCo.ai is the strategic AI observatory — built by Randolph Mbecheun. Coming soon." />
  <meta name="twitter:image" content="assets/favicon_optimized.png" />

  <link rel="canonical" href="https://planetco.ai" />
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "PlanetCo.ai",
      "url": "https://planetco.ai",
      "logo": "https://planetco.ai/assets/favicon_optimized.png",
      "founder": {
        "@type": "Person",
        "name": "Randolph Mbecheun"
      },
      "description": "The strategic AI observatory."
    }
  </script>

  <title>PlanetCo.ai — Coming Soon</title>
  <link rel="icon" type="image/png" href="assets/favicon_optimized.png">
  <link rel="apple-touch-icon" href="assets/favicon_optimized.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    body {
      background-color: #0a0a0f;
      color: #f0f0f0;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }

    /* Star field canvas — fixed behind everything */
    #stars {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* Subtle radial glow — observatory atmosphere */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 40%, rgba(74, 120, 246, 0.07) 0%, transparent 65%);
      pointer-events: none;
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Entrance animation base state — invisible + shifted down */
    .reveal {
      opacity: 0;
      transform: translateY(18px);
      animation: fadeUp 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .reveal:nth-child(1) { animation-delay: 0.05s; }
    .reveal:nth-child(2) { animation-delay: 0.15s; }
    .reveal:nth-child(3) { animation-delay: 0.25s; }
    .reveal:nth-child(4) { animation-delay: 0.38s; }
    .reveal:nth-child(5) { animation-delay: 0.50s; }
    .reveal:nth-child(6) { animation-delay: 0.62s; }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      margin-bottom: 2rem;
      object-fit: cover;
    }

    .eyebrow {
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #4a78f6;
      margin-bottom: 0.75rem;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2.2rem, 6vw, 3.5rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: #f0f0f0;
      margin-bottom: 1rem;
    }

    .tagline {
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      font-weight: 400;
      color: #8b91a8;
      max-width: 380px;
      line-height: 1.65;
      margin-bottom: 2rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(74, 120, 246, 0.08);
      border: 1px solid rgba(74, 120, 246, 0.22);
      border-radius: 100px;
      padding: 0.375rem 0.875rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      color: #4a78f6;
      margin-bottom: 3rem;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      background: #4a78f6;
      border-radius: 50%;
      flex-shrink: 0;
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.75); }
    }

    .name {
      font-family: 'Inter', sans-serif;
      font-size: 0.78rem;
      color: #3e4358;
    }

    .name strong {
      color: #555c75;
      font-weight: 500;
    }

    @media (prefers-reduced-motion: reduce) {
      .reveal {
        animation: none;
        opacity: 1;
        transform: none;
      }
      .badge-dot {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <canvas id="stars" aria-hidden="true"></canvas>

  <div class="container">
    <img src="assets/favicon_optimized.png" alt="PlanetCo.ai Logo" class="logo reveal" />
    <p class="eyebrow reveal">Strategic AI Observatory</p>
    <h1 class="reveal">PlanetCo.ai</h1>
    <p class="tagline reveal">The Strategic AI Observatory — tracking the forces shaping the age of intelligence.</p>
    <div class="badge reveal">
      <span class="badge-dot" aria-hidden="true"></span>
      Coming Soon
    </div>
    <div class="name reveal">Built by <strong>Randolph Mbecheun</strong></div>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('stars');
      const ctx = canvas.getContext('2d');

      // Respect reduced motion preference
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      const STAR_COUNT = 55;
      const stars = [];

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      function randomBetween(a, b) {
        return a + Math.random() * (b - a);
      }

      function createStar() {
        return {
          x: randomBetween(0, canvas.width),
          y: randomBetween(0, canvas.height),
          radius: randomBetween(0.4, 1.2),
          opacity: randomBetween(0.15, 0.45),
          speedX: randomBetween(-0.04, 0.04),
          speedY: randomBetween(-0.06, -0.02), // drift upward, very slowly
          twinkleOffset: randomBetween(0, Math.PI * 2),
          twinkleSpeed: randomBetween(0.003, 0.008),
        };
      }

      resize();
      for (let i = 0; i < STAR_COUNT; i++) stars.push(createStar());

      window.addEventListener('resize', () => {
        resize();
        stars.length = 0;
        for (let i = 0; i < STAR_COUNT; i++) stars.push(createStar());
      });

      let frame = 0;

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        frame++;

        for (const s of stars) {
          // Gentle twinkle via sine wave on opacity
          const twinkle = Math.sin(frame * s.twinkleSpeed + s.twinkleOffset) * 0.12;
          const alpha = Math.max(0, Math.min(1, s.opacity + twinkle));

          ctx.beginPath();
          ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(200, 215, 255, ${alpha})`;
          ctx.fill();

          // Drift
          s.x += s.speedX;
          s.y += s.speedY;

          // Wrap around edges
          if (s.y < -2) s.y = canvas.height + 2;
          if (s.x < -2) s.x = canvas.width + 2;
          if (s.x > canvas.width + 2) s.x = -2;
        }

        requestAnimationFrame(draw);
      }

      draw();
    })();
  </script>
</body>

</html>
