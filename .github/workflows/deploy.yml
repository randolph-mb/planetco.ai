name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::862910165525:role/github-actions-planetco-deploy
          aws-region: eu-central-1

      - name: Sync site to S3
        run: |
          aws s3 sync . s3://planetco-ai-website/ \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "CNAME" \
            --exclude ".gitignore" \
            --exclude "README.md" \
            --exclude ".replit"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E2SICO1TOH3WPF \
            --paths "/*"
